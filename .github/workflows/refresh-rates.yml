name: Refresh rates

# Two constraints shape this workflow.
#
# 1. Vercel's Hobby plan caps cron at once per day and rejects anything more
#    frequent at deploy time, so the 15-minute schedule cannot live there.
# 2. A full refresh across 8 corridors x 3 methods x 4 amounts can take close to
#    15 minutes when providers throttle requests. That is well past a serverless
#    function limit, so the job runs the refresh script directly against the
#    database. The HTTP route remains available for manual triggers.
#
# Running here also means Playwright adapters have a Chromium to use, which
# Vercel functions do not provide.
on:
  schedule:
    # Offset from the top of the hour, when GitHub's scheduler is busiest.
    # Runs at :07, :22, :37 and :52 UTC every hour.
    - cron: '7-59/15 * * * *'
  workflow_dispatch:

concurrency:
  # Never let a slow run overlap the next tick.
  group: refresh-rates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Leave enough room for dependency setup plus a throttled provider pass.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh rates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Browser adapters only run here — Vercel has no Chromium.
          BHEJO_ALLOW_BROWSER: '1'
          BHEJO_DISABLED_ADAPTERS: ${{ vars.BHEJO_DISABLED_ADAPTERS }}
        run: npm run refresh

      - name: Revalidate cached pages
        # Tells the deployment to drop its cached quote data. Skipped when the
        # repo variable is unset, so the workflow still works before first deploy.
        if: ${{ vars.SITE_URL != '' }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 60 -X POST \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -o /dev/null -w '%{http_code}' \
            "${SITE_URL}/api/cron/revalidate")
          echo "revalidate: HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Revalidate returned $status"
            exit 1
          fi
