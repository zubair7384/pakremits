# Staging application. Deploy this config from waheed_branch before merging.
app = "pakremits-staging"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[build.args]
  NEXT_PUBLIC_SITE_URL = "https://stage.pakremits.com"

[env]
  HOSTNAME = "0.0.0.0"
  NODE_ENV = "production"
  NEXT_PUBLIC_SITE_URL = "https://stage.pakremits.com"
  RESEND_FROM = "PakRemits alerts <alerts@pakremits.com>"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
